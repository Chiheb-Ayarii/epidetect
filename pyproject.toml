[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epidetect"
version = "0.1.0"
description = "Reproducible benchmark of high-frequency oscillation (HFO) detectors on realistic simulations and public intraoperative ECoG."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Chiheb Ayari" }]
# Exact pins live in requirements.txt; these are the minimum compatible versions.
dependencies = [
    "mne>=1.13",
    "mne-bids>=0.20",
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "PyWavelets>=1.6",
    "h5py>=3.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "NPY"]
