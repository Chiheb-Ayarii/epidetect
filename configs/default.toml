# EpiDetect default parameters. Every script reads this file; nothing is hard-coded elsewhere.
# Paths are relative to the repository root.

[paths]
raw_dir = "data/raw"
bids_root = "data/bids"
figures_dir = "figures"
results_dir = "results"

[data]
# Recordings excluded from every analysis, as [patient, session]. Justification is produced by
# scripts/02_quality_control.py (results/qc_duplicates.csv): the pre-resection recordings of
# patients 12, 15 and 17 are byte-identical in the source files, so at most one is genuine and
# we cannot tell which. They stay in the BIDS conversion (faithful copy), marked as bad.
excluded_recordings = [["12", "pre"], ["15", "pre"], ["17", "pre"]]

[recording]
# Zurich: European mains frequency.
line_freq_hz = 50.0
# Hardware passband of the Nicolet C-Series amplifier, read from the NIX metadata.
hardware_highpass_hz = 1.0
hardware_lowpass_hz = 800.0

[bids]
task = "intraop"
datatype = "ieeg"
# BrainVision stores float32 samples: no rescaling to 16-bit integers as EDF would need.
format = "BrainVision"

[qc]
# Welch PSD: 1 s Hann windows -> 1 Hz frequency resolution; 50 % overlap is the standard choice.
welch_window_s = 1.0
welch_overlap = 0.5
# Bands used for per-channel power (Hz).
broadband_hz = [1.0, 500.0]
ripple_band_hz = [80.0, 250.0]
fast_ripple_band_hz = [250.0, 500.0]
# Aperiodic (1/f) slope fitted in log-log space on this range, line-noise bins excluded.
aperiodic_fit_hz = [2.0, 40.0]
# Line noise: power within +/- half_width of k*50 Hz versus flanks [flank_inner, flank_outer] away.
line_half_width_hz = 1.0
line_flank_inner_hz = 2.0
line_flank_outer_hz = 5.0
# Highest harmonic inspected: 450 Hz = 9th harmonic, last one inside the FR band (< 500 Hz).
line_max_freq_hz = 450.0
# A harmonic is called "present" when it exceeds its flanks by this many dB.
line_present_db = 6.0
# Robust z-score threshold for relative channel flags (|z| > 5 ~ far beyond normal variation).
robust_z_threshold = 5.0
# Relative (robust z) criteria need enough channels for a stable median/MAD: with 4-6 strip
# channels the MAD is tiny and z-scores explode (|z| > 40 observed). Strips get absolute checks.
min_channels_for_relative_qc = 8
# Absolute criterion: a channel with std below this (uV) is considered flat / disconnected.
flat_std_uv = 1.0
# Absolute criterion: fraction of identical consecutive samples. 0.5 = sampled at fs/2 and
# duplicated (found once: P22 pre 3-4); every other channel is below 0.005.
max_repeated_fraction = 0.1

[simulation]
seed = 20261120
fs_hz = 2000.0
duration_s = 60.0
# No event centre within this margin of either end: filtfilt edge transients stay away.
edge_margin_s = 1.0
# Butterworth design order per edge (band-pass order 8, effective 16 after filtfilt).
filter_order = 4

[simulation.background]
# S(f) = max(f, f_min)^-beta + crossover^-beta. Values = medians fitted on the real channels
# (QC-flagged excluded) whose floor is reached below 500 Hz (61 % of 411), rounded: beta 3.48,
# crossover 260 Hz
# (scripts/03_calibrate_background.py -> results/background_fit_summary.csv).
beta = 3.5
crossover_hz = 260.0
# Below the knee the real spectra are shallower: 2-40 Hz exponent median 2.55 from the step-1 QC
# (results/qc_channels.csv, aperiodic_beta), rounded. The knee is the lower end of the fit range.
beta_low = 2.5
knee_hz = 20.0
# Below f_min the spectrum is flat (stands for the 1 Hz hardware high-pass).
f_min_hz = 1.0
# Median standard deviation of the real channels (results/qc_channels.csv, column std_uv).
std_uv = 140.0

[simulation.events]
ripple_band_hz = [80.0, 250.0]
fast_ripple_band_hz = [250.0, 500.0]
# Classic HFO definition: at least 4 oscillations.
n_cycles = [4.0, 10.0]
rate_ripple_per_min = 6.0
rate_fast_ripple_per_min = 6.0
rate_spike_per_min = 6.0
# Minimum distance between event centres: events never overlap.
min_gap_s = 0.5
# Probability that an HFO rides on a spike (as observed in the real data, e.g. P01).
p_hfo_on_spike = 0.3
# SNR in the event's band (dB); the benchmark varies it in step 4.
snr_db = 10.0
snr_jitter_db = 0.0

[simulation.spike]
# Uniform ranges (modelling choices, not fitted). Amplitude in units of background std.
amplitude_std = [3.0, 8.0]
tau_rise_ms = [1.0, 4.0]
tau_decay_ms = [4.0, 12.0]
slow_wave_ratio = [0.2, 0.5]
slow_wave_delay_ms = [40.0, 80.0]
slow_wave_sigma_ms = [20.0, 40.0]
# Apex rounding (Gaussian width). Fitted so that simulated spikes ring after a 250-500 Hz
# band-pass as much as real transients do (scripts/03_calibrate_simulator.py, part 2;
# results/spike_apex_grid.csv). A pure cusp (0 ms) rings ~20x too strongly.
apex_sigma_ms = [1.1, 1.6]

[calibration]
# Background-model fit range: above 500 Hz the real spectra fall (anti-aliasing roll-off).
fit_range_hz = [20.0, 500.0]
line_exclusion_hz = 3.0
# Spike calibration (scripts/03_calibrate_simulator.py, part 2).
# Real transients: robust z above this threshold in the 3-40 Hz band ...
transient_band_hz = [3.0, 40.0]
transient_z = 8.0
transient_min_gap_s = 0.3
# ... and no marked FR within this distance (a real FR would inflate the ringing ratio).
fr_exclusion_s = 0.1
ringing_half_window_s = 0.03
# Simulated spikes used for each candidate apex-width range.
spike_sim_duration_s = 300.0
spike_sim_rate_per_min = 30.0
apex_low_grid_ms = [0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.2]
apex_high_grid_ms = [1.2, 1.4, 1.6, 1.8, 2.0, 2.5, 3.0]
